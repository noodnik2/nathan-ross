<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Chronology</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #1f2328;
      background: #ffffff;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      border-bottom: 1px solid #d1d9e0;
      padding-bottom: 0.3rem;
      margin: 1.5rem 0 1rem;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 1rem 0;
      border-radius: 6px;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #0d1117;
        color: #e6edf3;
      }
      h1 {
        border-bottom-color: #30363d;
      }
    }
  </style>
</head>
<body>
  <img src="images/violinist-nathan-ross.webp" alt="violinist-nathan-ross">

  <h1>Visual Chronology</h1>

  <img src="images/lil-nacy-with-mom-n-sibs.webp" alt="lil-nacy-with-mom-n-sibs">

  <img src="images/portrait-young-violinist.webp" alt="portrait-young-violinist.webp">

  <img src="images/newsclip-violinist-study-in-south.webp" alt="newsclip-violinist-study-in-south">

  <img src="images/newsclip-kitsilano-violinist-earns-us-award.webp" alt="newsclip-kitsilano-violinist-earns-us-award">

  <img src="images/concertmaster-nbc-symphony.webp" alt="concertmaster-nbc-symphony">

  <img src="images/lucky-bastards-club.webp" alt="lucky-bastards-club">
</body>
</html>
